<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Кирпичные птички</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Rubik+Mono+One&display=swap">
<style>
/* Единый игрушечный мир: окна-кирпичи с шипами сверху поверх объёмного острова. */
:root{
  --ink:#1d2433; --paper:#fff8e6; --red:#d7263d; --yellow:#ffc928; --blue:#1f6fd1; --green:#2fa84f;
  --display:"Rubik Mono One","Arial Black",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#bfd9f2;color:var(--ink);font-family:var(--body);font-weight:800;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.brick{position:relative;background:var(--c,var(--yellow));border-radius:6px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 rgba(0,0,0,.25)}
.brick::before{content:"";position:absolute;left:12px;right:12px;top:-7px;height:8px;
  background:radial-gradient(circle at 11px 8px,var(--c,var(--yellow)) 10px,transparent 10.5px) 0 0/34px 8px repeat-x}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.big{--c:var(--yellow);font-family:var(--display);font-size:clamp(15px,3.6vw,20px);padding:15px 22px;transition:transform .08s}
.big:active{transform:translateY(3px)}
.big.alt{--c:#fff;}

#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none}
#status{--c:#fff;padding:8px 14px 10px;min-width:0;max-width:min(62vw,340px)}
#lvlName{font-family:var(--display);font-size:clamp(12px,3.1vw,15px);line-height:1.2}
#bar{height:11px;border-radius:4px;background:#dfe4ec;margin-top:6px;overflow:hidden}
#fill{height:100%;width:0;background:var(--green);transition:width .2s}
#count{font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}
#tools{display:flex;gap:9px;pointer-events:auto}
.tool{--c:#fff;width:46px;height:42px;font-size:19px;display:grid;place-items:center;padding:0}
.tool::before{left:8px;right:8px;background-size:30px 8px}
#hands{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;pointer-events:none}
.slot{width:30px;height:20px;border-radius:4px;background:rgba(255,255,255,.55);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.slot.on{background:var(--yellow)}
#toast{position:fixed;left:50%;top:calc(92px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);max-width:min(88vw,460px);text-align:center;
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:clamp(15px,3.8vw,19px);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--red)}
#keys{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(46px + env(safe-area-inset-bottom,0px));color:#fff;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none;white-space:nowrap}
#joy{position:fixed;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 3px rgba(255,255,255,.6);pointer-events:none;transition:opacity .15s}
#joy.rest{opacity:.7}
#nub{position:absolute;left:32px;top:32px;width:48px;height:48px;border-radius:12px;background:var(--yellow);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;overflow:auto;gap:18px;
  padding-block:calc(22px + env(safe-area-inset-top,0px)) calc(22px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(19,27,48,.42)}
.screen>*{flex:none}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7.2vw,58px);line-height:1.05;margin:auto 0 0;text-align:center;color:#fff;text-shadow:0 4px 0 var(--red),0 8px 0 rgba(0,0,0,.25);text-wrap:balance}
.lead{margin:0;color:#fff;text-align:center;font-size:clamp(16px,3.8vw,20px);max-width:34em;text-shadow:0 1px 4px rgba(0,0,0,.6);text-wrap:balance}
#cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px 12px;width:min(100%,900px);margin-bottom:auto;padding-top:8px}
.card{--c:#fff;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;transition:transform .08s}
.card:not(:disabled):active{transform:translateY(3px)}
.card:disabled{--c:#c9cfdb;cursor:default}
.card canvas{width:100%;max-width:130px;aspect-ratio:1;image-rendering:pixelated}
.card b{font-size:clamp(14px,2.2vw,16px);font-weight:900;line-height:1.15;text-align:center}
.stars{color:#d59a00;font-size:16px;letter-spacing:1px;min-height:20px}
.stars i{font-style:normal;color:rgba(0,0,0,.18)}
#win{background:none;pointer-events:none}
#winBox{--c:#fff;margin:auto 0 0;pointer-events:auto;padding:20px 22px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;width:min(100%,430px);text-align:center}
#winBox h2{font-family:var(--display);font-weight:400;font-size:clamp(20px,5vw,27px);line-height:1.2;margin:0;text-wrap:balance}
#winBox p{margin:0;font-size:17px}
#winStars{font-size:36px;color:#ffb400;letter-spacing:4px}
#winStars i{font-style:normal;color:#dfe4ec}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
@media (max-width:700px){#cards{grid-template-columns:repeat(2,minmax(0,1fr));max-width:340px}
  .card:last-child{grid-column:1/-1;justify-self:center;width:calc(50% - 6px)}}
</style>

<canvas id="scene"></canvas>

<div id="hud" hidden>
  <div id="status" class="brick"><div id="lvlName"></div><div id="bar"><div id="fill"></div></div><div id="count"></div></div>
  <div id="tools">
    <button id="soundBtn" class="brick tool" aria-label="Звук">🔊</button>
    <button id="menuBtn" class="brick tool" aria-label="В меню">☰</button>
  </div>
</div>
<div id="hands" hidden></div>
<div id="keys" hidden>Стрелки или WASD: бежать. Мышь: повернуть вид.</div>
<div id="toast"></div>
<div id="joy" hidden><div id="nub"></div></div>

<section id="menu" class="screen">
  <h1>Кирпичные птички</h1>
  <p class="lead">Собирай птичку по деталькам и неси на подставку. Кот Бандит всё разбрасывает, так что гони его прочь!</p>
  <div id="cards"></div>
</section>

<section id="win" class="screen" hidden>
  <div id="winBox" class="brick">
    <h2 id="winTitle"></h2>
    <div id="winStars"></div>
    <p id="winText"></p>
    <div class="row">
      <button id="nextBtn" class="brick big">Дальше</button>
      <button id="winMenuBtn" class="brick big alt">Меню</button>
    </div>
  </div>
</section>

};

/* ---------- Подготовка птиц: воксели, затем склейка в прямоугольные кирпичи ---------- */
const MAX_LEN=6,MAX_WID=3;
function voxelsOf(b){
  const vox=[]; let rows=Math.max(...b.slices.map(s=>s.length)),cols=Math.max(...b.slices.flat().map(r=>r.length));
  if(b.fan){cols=Math.max(cols,b.fan.col+Math.ceil(b.fan.r)+1)}
  b.slices.forEach((s,si)=>{
    s.forEach((row,ri)=>{
      [...row].forEach((ch,ci)=>{
        if(ch==='.')return;
        const part=si>=b.wingFrom?'w':'b';
        const y=rows-1-ri;
        if(si===0)vox.push({x:ci,y,z:0,c:ch,part});
        else{vox.push({x:ci,y,z:si,c:ch,part});vox.push({x:ci,y,z:-si,c:ch,part})}
      });
    });
  });
  if(b.fan)addFan(b,vox,rows);
  return{vox,rows,cols};
}
function addFan(b,vox,rows){
  const f=b.fan,has=new Set(vox.map(v=>v.x+','+v.y+','+v.z)),cy=rows-1-f.row;
  for(let x=0;x<=f.col+13;x++)for(let y=0;y<rows;y++){
    const dx=x-f.col+.5,dy=y-cy,r=Math.hypot(dx,dy),a=Math.atan2(dy,dx);
    if(r<3.2||r>f.r||a<-.3||a>2.1||has.has(x+','+y+',0'))continue;
    const sector=Math.round((a+.3)/.3),edge=Math.abs((a+.3)/.3-sector);
    let c='G';
    if(r>9.6)c=edge<.27?'U':(r>11.4?'T':'m');
    else if(r>6.8)c=edge<.27?'Y':'T';
    else c=sector%2?'m':'G';
    vox.push({x,y,z:0,c,part:'b'});
  }
}
function toBricks(b){
  const{vox,rows,cols}=voxelsOf(b),cell=new Map(),k=(x,y,z)=>x+','+y+','+z,out=[];
  vox.forEach(v=>cell.set(k(v.x,v.y,v.z),v));
  const zs=[...new Set(vox.map(v=>v.z))].sort((a,b)=>a-b);
  for(let y=0;y<rows;y++)for(const z0 of zs)for(let x0=0;x0<cols;x0++){
    const v=cell.get(k(x0,y,z0)); if(!v)continue;
    const same=(x,z)=>{const o=cell.get(k(x,y,z));return o&&o.c===v.c&&o.part===v.part&&(o.part==='b'||Math.sign(o.z)===Math.sign(v.z))};
    let lx=1; while(lx<MAX_LEN&&same(x0+lx,z0))lx++;
    let lz=1;
    outer:while(lz<MAX_WID){for(let i=0;i<lx;i++)if(!same(x0+i,z0+lz))break outer;lz++}
    for(let i=0;i<lx;i++)for(let j=0;j<lz;j++)cell.delete(k(x0+i,y,z0+j));
    out.push({x:x0,y,z:z0,lx,lz,c:v.c,part:v.part});
  }
  return{bricks:out,rows,cols};
}
BIRDS.forEach(b=>{Object.assign(b,toBricks(b));b.unit=Math.min(.62,10/b.cols)});

Object.assign(sun.shadow.camera,{left:-34,right:34,top:34,bottom:-34,near:1,far:90});sun.shadow.bias=-.0006;scene.add(sun);

const flat=new WeakMap();
function flatGeo(g){if(!g.index)return g;if(!flat.has(g))flat.set(g,g.toNonIndexed());return flat.get(g)}
function bake(items){ // items: {geo,m(atrix),c(olor)} -> одна геометрия с цветами вершин
  let n=0; const prepared=items.map(it=>{const g=flatGeo(it.geo);n+=g.attributes.position.count;return{g,it}});
  const pos=new Float32Array(n*3),nor=new Float32Array(n*3),col=new Float32Array(n*3),v=new THREE.Vector3(),c=new THREE.Color();
  const nm=new THREE.Matrix3();let o=0;
  prepared.forEach(({g,it})=>{
    c.set(it.c);const P=g.attributes.position,N=g.attributes.normal,m=it.m;
    if(m)nm.getNormalMatrix(m);
    for(let i=0;i<P.count;i++,o++){
      v.fromBufferAttribute(P,i);if(m)v.applyMatrix4(m);pos.set([v.x,v.y,v.z],o*3);
      v.fromBufferAttribute(N,i);if(m)v.applyMatrix3(nm).normalize();nor.set([v.x,v.y,v.z],o*3);
      col.set([c.r,c.g,c.b],o*3);
    }
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('normal',new THREE.BufferAttribute(nor,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  return g;
}
const at=(x,y,z)=>new THREE.Matrix4().makeTranslation(x,y,z);
const unitBox=new THREE.BoxGeometry(1,1,1);
const box=(w,h,d,x,y,z,c)=>({geo:unitBox,m:new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),new THREE.Quaternion(),new THREE.Vector3(w,h,d)),c});

const studCache=new Map();
function studGeo(u){
  if(!studCache.has(u)){
    const cap=new THREE.CircleGeometry(u*.29,8);cap.rotateX(-Math.PI/2);cap.translate(0,u*.08,0);
    studCache.set(u,{stud:new THREE.CylinderGeometry(u*.29,u*.29,u*.16,8,1,true),cap});
  }
  return studCache.get(u);
}
function brickItems(lx,lz,u,c,ox=0,oy=0,oz=0){ // кирпич с шипами

function buildChunks(b){ // деталь: несколько кирпичей, соседних по птице

    list.forEach((br,i)=>{const p=ps[i],hx=br.lx*u/2,hz=br.lz*u/2,hy=u*.425;

    const c=bb.getCenter(new THREE.Vector3()),items=[];

function makeFlyer(b,scale){ // запечённая птица с машущими крыльями

  for(let x=-R_WORLD-1;x<=R_WORLD+1;x+=T)for(let z=-R_WORLD-1;z<=R_WORLD+1;z+=T)if(Math.hypot(x,z)<R_WORLD+1.8)tiles.push([x,z]);

  const m=new THREE.Matrix4(),c=new THREE.Color();

    m.makeScale(T-.03,1.6,T-.03);m.setPosition(x,-.8,z);tileM.setMatrixAt(n,m);tileM.setColorAt(n,c);

  });

  // Камни под островом, чтобы он висел в небе
  const under=[];for(let n=0;n<70;n++){const a=rand()*6.28,r=Math.sqrt(rand())*R_WORLD*.86,s=2+rand()*4;under.push(box(s,3+rand()*5,s,Math.cos(a)*r,-3-rand()*3-(R_WORLD-r)*.2,Math.sin(a)*r,0x75604e))}

  // Подставка
  const pl=[box(R_PLINTH*2-.8,.5,R_PLINTH*2-.8,0,.25,0,t.plinth),box(R_PLINTH*2-2,.3,R_PLINTH*2-2,0,.65,0,0xffffff)];

  // Деревья и всё остальное

  for(let n=0,tries=0;n<(b.theme==='garden'?24:15)&&tries<400;tries++){
    const a=rand()*6.28,r=15+rand()*11,x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(Math.abs(x)<4&&z>6&&z<16)continue;
    if(obstacles.some(o=>Math.hypot(o.x-x,o.z-z)<o.r+2.6))continue;
    const kind=t.decor[rand()*t.decor.length|0],cr=DECOR[kind](x,z,it,t,rand);

  }
  const dm=new THREE.Mesh(bake(it),MAT_MATTE);dm.castShadow=true;dm.receiveShadow=true;dm.userData.temp=true;world.add(dm);
  if(t.stars){

    mesh.position.set(s.x,o.gy,s.z);mesh.rotation.y=rand()*3;world.add(mesh);S.bricks.push(o);

  camFocus.set(0,0,9.5);
}
function freeSpot(rand){

    const a=rand()*6.28,r=R_PLINTH+2.2+rand()*(R_WORLD-R_PLINTH-3.5),x=Math.cos(a)*r,z=Math.sin(a)*r;

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}
    p.vy-=13*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.r+=dt*7;if(p.y<.1){p.y=.1;p.vy*=-.4;p.vx*=.7;p.vz*=.7}}

  particles.forEach((p,i)=>{_e.set(p.r,p.r*.7,0);_q.setFromEuler(_e);_p.set(p.x,p.y,p.z);_m.compose(_p,_q,_s);pMesh.setMatrixAt(i,_m);pMesh.setColorAt(i,_c.set(p.c))});

    if(l>mx){dx*=mx/l;dy*=mx/l}
    joy.x=dx/mx;joy.y=dy/mx;$('nub').style.transform=`translate(${dx}px,${dy}px)`;
  }else if(drag&&e.pointerId===drag.id){S.yaw-=(e.clientX-drag.x)*.006;drag.x=e.clientX}
});
function joyRest(){ // в покое джойстик стоит внизу и подсказывает, куда нажимать
  joy.id=null;joy.x=joy.y=0;const j=$('joy');
  j.style.left='50%';j.style.top=(innerHeight-118)+'px';j.classList.add('rest');$('nub').style.transform='';
  j.hidden=!(touchDevice&&S.mode==='play');
}
const endPtr=e=>{if(e.pointerId===joy.id)joyRest();if(drag&&e.pointerId===drag.id)drag=null};
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);

/* ---------- Игровая логика ---------- */
let toastTimer=0;
function toast(msg,bad,sec=2.6){const t=$('toast');t.textContent=msg;t.className='show'+(bad?' bad':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.className=bad?'bad':''},sec*1000)}
function drawHands(){
  $('hands').innerHTML=Array.from({length:CAP},(_,i)=>`<div class="slot${i<S.carried.length?' on':''}"></div>`).join('');
}
function drawHud(){
  const total=S.bricks.length,n=S.bricks.filter(b=>b.state==='placed').length;
  $('lvlName').textContent=(S.lvl+1)+'. '+S.bird.name;
  $('fill').style.width=(n/total*100)+'%';
  $('count').textContent=`Детальки: ${n} из ${total}`;
}
function flyTo(o,tx,ty,tz,dur,arc,after){
  o.state='fly';o.t=0;o.dur=dur;o.arc=arc;o.after=after;
  o.from=o.mesh.position.clone();o.to=new THREE.Vector3(tx,ty,tz);o.rx=(Math.random()-.5)*7;o.ry=o.mesh.rotation.y;
}
function pickUp(o){
  o.state='carried';S.carried.push(o);sfx.pick();burst(o.mesh.position.x,o.mesh.position.y,o.mesh.position.z,[o.ch.color],4,3);drawHands();
}
function dropOne(){
  const o=S.carried.shift();drawHands();
  flyTo(o,o.slot.x,o.slot.y,o.slot.z,.5,3,()=>{
    o.state='placed';o.mesh.position.copy(o.slot);o.mesh.rotation.set(0,0,0);o.pop=1;sfx.snap();drawHud();
    if(S.bricks.every(b=>b.state==='placed'))startWin();
  });
  o.mesh.scale.setScalar(1);
}
function scatter(cat){
  const placed=S.bricks.filter(b=>b.state==='placed').sort((a,b)=>b.slot.y-a.slot.y);
  const n=Math.min(placed.length,2+Math.min(S.lvl,2)),pool=placed.slice(0,Math.max(n,Math.ceil(placed.length*.5)));
  for(let i=0;i<n;i++){
    const o=pool.splice(Math.random()*pool.length|0,1)[0],s=freeSpot(Math.random);
    flyTo(o,s.x,o.gy,s.z,.9+Math.random()*.4,7+Math.random()*4,()=>{o.state='ground';o.x=s.x;o.z=s.z;o.mesh.rotation.set(0,Math.random()*3,0)});
  }
  if(n){S.hits++;sfx.scatter();toast('Бандит раскидал детальки! Собирай заново.',true);burst(0,S.baseY+2,0,[0xffffff,0xffc928],16,7);drawHud()}
}
function updateCat(c,dt){
  c.t+=dt;const m=c.mesh,p=m.position;
  const go=(tx,tz,sp)=>{const dx=tx-p.x,dz=tz-p.z,l=Math.hypot(dx,dz)||1;p.x+=dx/l*sp*dt;p.z+=dz/l*sp*dt;
    m.rotation.y=Math.atan2(dz,-dx);const sw=Math.sin(S.time*15)*.7;m.legs.forEach((g,i)=>g.rotation.z=i%3?sw:-sw);return l};
  m.tail.rotation.z=Math.sin(S.time*7)*.35;
  if(c.state==='wait'){
    c.timer-=dt;
    if(c.timer<=0){
      if(S.bricks.filter(b=>b.state==='placed').length<2){c.timer=3;return}
      const a=Math.random()*6.28;p.set(Math.cos(a)*(R_WORLD-1),0,Math.sin(a)*(R_WORLD-1));m.visible=true;m.rotation.y=Math.atan2(-p.z,p.x);
      c.state='peek';c.t=0;c.den=a;sfx.meow();toast('Кот Бандит идёт к птичке! Беги и прогони его!',true);
    }
  }else if(c.state==='peek'){
    p.y=Math.abs(Math.sin(c.t*9))*.35;if(c.t>1.4){p.y=0;c.state='run'}
  }else if(c.state==='run'){
    if(go(0,0,4.4)<R_PLINTH+.6){c.state='swipe';c.t=0}
  }else if(c.state==='swipe'){
    p.y=Math.sin(Math.min(c.t/.5,1)*Math.PI)*1.6;
    if(c.t>.5){p.y=0;scatter(c);c.state='flee'}
  }else if(c.state==='flee'){
    const tx=Math.cos(c.den)*(R_WORLD+6),tz=Math.sin(c.den)*(R_WORLD+6);
    if(go(tx,tz,10)<1){m.visible=false;c.state='wait';c.timer=S.bird.catEvery*(.85+Math.random()*.3)}
  }
  if((c.state==='run'||c.state==='peek')&&Math.hypot(p.x-player.position.x,p.z-player.position.z)<2.1){
    p.y=0;c.state='flee';c.den=Math.atan2(p.z,p.x);S.shoos++;sfx.shoo();toast('Кыш! Кот Бандит убежал!');
    burst(p.x,1.2,p.z,[0xf08a24,0xffffff,0xffc928],14,5);
  }
}
function updatePlayer(dt){
  let ix=joy.x,iz=joy.y;
  if(keys.has('l'))ix-=1;if(keys.has('r'))ix+=1;if(keys.has('u'))iz-=1;if(keys.has('d'))iz+=1;
  if(keys.has('q'))S.yaw+=dt*1.8;if(keys.has('e'))S.yaw-=dt*1.8;
  const l=Math.hypot(ix,iz),p=player.position;
  if(l>.05){
    const k=Math.min(l*1.5,1)/l,sp=8.6;ix*=k;iz*=k;
    const c=Math.cos(S.yaw),s=Math.sin(S.yaw),dx=ix*c+iz*s,dz=-ix*s+iz*c;
    p.x+=dx*sp*dt;p.z+=dz*sp*dt;
    let want=Math.atan2(-dx,-dz),d=want-player.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));player.rotation.y+=d*Math.min(1,dt*13);
    const w=Math.sin(S.time*13)*.85;player.legL.rotation.x=w;player.legR.rotation.x=-w;player.armL.rotation.x=-w;player.armR.rotation.x=w;
  }else{['legL','legR','armL','armR'].forEach(k=>player[k].rotation.x*=.75)}
  obstacles.forEach(o=>{const dx=p.x-o.x,dz=p.z-o.z,d=Math.hypot(dx,dz);if(d<o.r+.5&&d>0){p.x=o.x+dx/d*(o.r+.5);p.z=o.z+dz/d*(o.r+.5)}});
  const r=Math.hypot(p.x,p.z);if(r>R_WORLD){p.x*=R_WORLD/r;p.z*=R_WORLD/r}
}
function updateBricks(dt){
  const p=player.position;
  S.bricks.forEach(o=>{
    const m=o.mesh;
    if(o.state==='ground'){
      m.position.set(o.x,o.gy+Math.sin(S.time*2.4+o.phase)*.12,o.z);m.rotation.y+=dt*1.1;
      if(S.mode==='play'&&S.carried.length<CAP&&Math.hypot(o.x-p.x,o.z-p.z)<2.2)pickUp(o);
    }else if(o.state==='fly'){
      o.t+=dt;const k=Math.min(o.t/o.dur,1),e=k*k*(3-2*k);
      m.position.lerpVectors(o.from,o.to,e);m.position.y+=Math.sin(k*Math.PI)*o.arc;
      m.rotation.set(o.rx*(1-k),o.ry*(1-k),0);
      if(k>=1)o.after();
    }else if(o.state==='placed'&&o.pop>0){
      o.pop=Math.max(0,o.pop-dt*5);m.scale.setScalar(1+Math.sin(o.pop*3.14)*.14);if(!o.pop)m.scale.setScalar(1);
    }
  });
  let y=2.12;
  S.carried.forEach(o=>{
    const hh=o.ch.h*.55;y+=hh/2;
    o.mesh.scale.setScalar(.55);o.mesh.rotation.set(0,player.rotation.y,0);
    o.mesh.position.set(p.x,y+Math.sin(S.time*9)*.02,p.z);y+=hh/2+.05;
  });
  S.dropCd-=dt;
  if(S.mode==='play'&&S.carried.length&&Math.hypot(p.x,p.z)<R_PLINTH+1.7&&S.dropCd<=0){S.dropCd=.15;dropOne()}
}
function updateArrow(){
  if(S.mode!=='play'){arrow.visible=false;return}
  const p=player.position,cat=S.cats.find(c=>c.state==='run'||c.state==='peek');
  let tx,tz,col=0xffc928;
  const left=S.bricks.filter(o=>o.state==='ground');
  if(cat){tx=cat.mesh.position.x;tz=cat.mesh.position.z;col=0xd7263d}
  else if(S.carried.length>=CAP||(!left.length&&S.carried.length)){tx=0;tz=0;col=0x2fa84f}
  else if(left.length){let best=1e9;left.forEach(o=>{const d=Math.hypot(o.x-p.x,o.z-p.z);if(d<best){best=d;tx=o.x;tz=o.z}})}
  else{arrow.visible=false;return}
  const a=Math.atan2(tx-p.x,tz-p.z);arrow.visible=true;arrow.material.color.setHex(col);
  arrow.position.x=p.x+Math.sin(a)*(1.9+Math.sin(S.time*7)*.14);arrow.position.z=p.z+Math.cos(a)*(1.9+Math.sin(S.time*7)*.14);arrow.rotation.y=a;
}
const camFocus=new THREE.Vector3();
function updateCamera(dt){
  if(S.mode==='menu'){
    const a=S.time*.11,b=S.bird,d=38;
    camera.position.set(Math.sin(a)*d,23,Math.cos(a)*d);camera.lookAt(0,b.rows*b.unit*.3,0);return;
  }
  if(S.mode==='win'){
    const k=Math.min(S.winT/1.4,1),a=S.yaw+S.winT*.16,d=S.camD;
    camFocus.lerp(_p.set(0,winBird?Math.min(winBird.position.y*.75,12):3,0),Math.min(1,dt*1.8));
    camera.position.set(camFocus.x+Math.sin(a)*d,camFocus.y+S.camH*.6,camFocus.z+Math.cos(a)*d);camera.lookAt(camFocus);return;
  }
  camFocus.lerp(player.position,Math.min(1,dt*6));
  camera.position.set(camFocus.x+Math.sin(S.yaw)*S.camD,S.camH,camFocus.z+Math.cos(S.yaw)*S.camD);
  camera.lookAt(camFocus.x,1.6,camFocus.z);
}
function updateFlyers(dt){
  flyers.forEach(f=>{const u=f.userData,a=S.time*u.sp+u.ph;
    f.position.set(Math.cos(a)*u.r,u.h+Math.sin(a*2)*1.2,Math.sin(a)*u.r);
    f.rotation.y=Math.atan2(Math.cos(a),Math.sin(a));
    const w=1.25+Math.sin(S.time*7+u.ph)*.5;f.wl.rotation.x=w;f.wr.rotation.x=-w});
}
function startWin(){
  S.mode='win';S.winT=0;arrow.visible=false;$('toast').className='';joyRest();
  S.cats.forEach(c=>{c.mesh.visible=false;c.state='gone'});
  sfx.win();
  const b=S.bird,stars=S.hits===0?3:S.hits<=2?2:1;
  save.stars[S.lvl]=Math.max(save.stars[S.lvl]||0,stars);persist();
  $('hud').hidden=$('hands').hidden=$('keys').hidden=true;
  S.pendingStars=stars;
}
function showWin(){
  const b=S.bird,last=S.lvl===BIRDS.length-1,stars=S.pendingStars;
  $('winTitle').textContent=`Ура! ${b.name} ${b.id==='zhar'?'ожила':'ожил'}!`;
  $('winStars').innerHTML='★'.repeat(stars)+`<i>${'★'.repeat(3-stars)}</i>`;
  const hint=stars<3?'Прогоняй кота раньше, чем он прыгнет на подставку, и получишь три звезды.':'Кот ни разу не добрался до птички!';
  $('winText').textContent=last?`Вся стая собрана! ${hint}`:`${hint} Новая птичка уже ждёт.`;
  $('nextBtn').textContent=last?'К стае':'Дальше';
  $('win').hidden=false;
}
function updateWin(dt){
  S.winT+=dt;const b=S.bird,t=S.winT;
  if(t<1.2&&Math.random()<.5)burst((Math.random()-.5)*8,S.baseY+Math.random()*6,(Math.random()-.5)*4,Object.values(b.pal),3,5);
  if(!winBird&&t>.9){
    S.bricks.forEach(o=>o.mesh.visible=false);ghost.visible=false;
    winBird=makeFlyer(b,1);world.add(winBird);winBird.position.set(0,S.baseY+winBird.midY,0);
    burst(0,S.baseY+3,0,Object.values(b.pal),60,9);tone(1047,.3,'triangle',.12,1568);
  }
  if(winBird){
    const k=t-.9,lift=Math.min(k/2.4,1),r=lift*lift*13,a=k*.75,h=S.baseY+winBird.midY+lift*11+Math.sin(k*2)*.4;
    winBird.position.set(Math.cos(a)*r,h,Math.sin(a)*r);
    if(r>.4)winBird.rotation.y=Math.atan2(Math.cos(a),Math.sin(a));
    const w=1.25+Math.sin(k*11)*.55;winBird.wl.rotation.x=w;winBird.wr.rotation.x=-w;
  }
  if(t>3.6&&$('win').hidden)showWin();
}

/* ---------- Экраны ---------- */
function thumb(b,cv,locked){
  const px=Math.max(b.cols,b.rows)+2;cv.width=cv.height=px;const g=cv.getContext('2d'),ox=(px-b.cols)>>1,oy=(px-b.rows)>>1,top=new Map();
  voxelsOf(b).vox.forEach(v=>{const k=v.x+','+v.y,o=top.get(k);if(!o||v.z>o.z)top.set(k,v)});
  top.forEach(v=>{g.fillStyle=locked?'#79808f':'#'+b.pal[v.c].toString(16).padStart(6,'0');g.fillRect(ox+v.x,oy+b.rows-1-v.y,1,1)});
}
function renderCards(){
  const box=$('cards');box.innerHTML='';
  BIRDS.forEach((b,i)=>{
    const open=i===0||save.stars[i-1],got=save.stars[i]||0,btn=document.createElement('button');
    btn.className='card brick';btn.disabled=!open;
    btn.innerHTML=`<canvas></canvas><b>${open?b.name:'???'}</b><div class="stars">${open?'★'.repeat(got)+`<i>${'★'.repeat(3-got)}</i>`:''}</div>`;
    thumb(b,btn.querySelector('canvas'),!open);
    btn.onclick=()=>{audio();startLevel(i)};box.appendChild(btn);
  });
}
function showMenu(){
  S.mode='menu';joyRest();
  const next=BIRDS.findIndex((b,i)=>!save.stars[i]);
  buildWorld(next<0?BIRDS.length-1:next);player.visible=false;arrow.visible=false;
  $('hud').hidden=$('hands').hidden=$('keys').hidden=true;$('win').hidden=true;$('menu').hidden=false;renderCards();
}
function startLevel(i){
  buildWorld(i);S.mode='play';
  $('menu').hidden=$('win').hidden=true;$('hud').hidden=$('hands').hidden=false;$('keys').hidden=touchDevice;
  joyRest();drawHud();drawHands();
  toast(i===0?(touchDevice?'Води пальцем по экрану, чтобы бежать. Неси детальки на подставку!':'Подбирай детальки и неси на подставку. За раз можно взять 4.'):`Собери ${S.bird.acc}! Жёлтая стрелка покажет, куда бежать.`,false,4);
  setTimeout(()=>{if(S.mode==='play')$('keys').hidden=true},9000);
}
$('menuBtn').onclick=showMenu;
$('winMenuBtn').onclick=showMenu;
$('nextBtn').onclick=()=>{S.lvl<BIRDS.length-1?startLevel(S.lvl+1):showMenu()};
function drawSound(){$('soundBtn').textContent=soundOn?'🔊':'🔇'}
$('soundBtn').onclick=()=>{audio();soundOn=!soundOn;drawSound();try{localStorage.setItem('kirpich-sound',soundOn?'on':'off')}catch(e){}};
drawSound();

/* ---------- Цикл ---------- */
function resize(){const w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?62:46;camera.updateProjectionMatrix();if(joy.id===null)joyRest()}
addEventListener('resize',resize);resize();
let last=performance.now(),fpsT=0,frames=0,quality=2;
function watchSpeed(raw){ // слабый телефон: сначала меньше пикселей, потом без теней
  if(raw>.5){fpsT=frames=0;return}
  fpsT+=raw;frames++;
  if(fpsT<3)return;
  const fps=frames/fpsT;fpsT=frames=0;
  if(fps>=28||!quality)return;
  quality--;
  if(quality===1){renderer.setPixelRatio(1);resize()}else sun.castShadow=false;
}
function frame(now){
  requestAnimationFrame(frame);
  const raw=(now-last)/1000;last=now;watchSpeed(raw);step(Math.min(raw,.05));
}
function step(dt){
  S.time+=dt;
  if(S.mode==='play'){updatePlayer(dt);S.cats.forEach(c=>updateCat(c,dt))}
  if(S.mode==='win')updateWin(dt);
  updateBricks(dt);updateArrow();updateFlyers(dt);updateParticles(dt);updateCamera(dt);
  renderer.render(scene,camera);
}
window.__kp={S,BIRDS,startLevel,keys,player,save,step,joy};
showMenu();
requestAnimationFrame(frame);
</script>
