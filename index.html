<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Кирпичный лес</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Rubik+Mono+One&display=swap">
<style>
/* Единый игрушечный мир: окна-кирпичи с шипами сверху поверх объёмного острова. */
:root{
  --ink:#1d2433; --paper:#fff8e6; --red:#d7263d; --yellow:#ffc928; --blue:#1f6fd1; --green:#2fa84f;
  --display:"Rubik Mono One","Arial Black",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#bfd9f2;color:var(--ink);font-family:var(--body);font-weight:800;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.brick{position:relative;background:var(--c,var(--yellow));border-radius:6px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 rgba(0,0,0,.25)}
.brick::before{content:"";position:absolute;left:12px;right:12px;top:-7px;height:8px;
  background:radial-gradient(circle at 11px 8px,var(--c,var(--yellow)) 10px,transparent 10.5px) 0 0/34px 8px repeat-x}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.big{--c:var(--yellow);font-family:var(--display);font-size:clamp(15px,3.6vw,20px);padding:15px 22px;transition:transform .08s}
.big:active{transform:translateY(3px)}
.big.alt{--c:#fff;}

#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none}
#status{--c:#fff;padding:8px 14px 10px;min-width:0;max-width:min(62vw,340px)}
#lvlName{font-family:var(--display);font-size:clamp(12px,3.1vw,15px);line-height:1.2}
#bar{height:11px;border-radius:4px;background:#dfe4ec;margin-top:6px;overflow:hidden}
#fill{height:100%;width:0;background:var(--green);transition:width .2s}
#count{font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}
#tools{display:flex;gap:9px;pointer-events:auto}
.tool{--c:#fff;width:46px;height:42px;font-size:19px;display:grid;place-items:center;padding:0}
.tool::before{left:8px;right:8px;background-size:30px 8px}
#hands{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;pointer-events:none}
.slot{width:30px;height:20px;border-radius:4px;background:rgba(255,255,255,.55);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.slot.on{background:var(--yellow)}
#toast{position:fixed;left:50%;top:calc(92px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);max-width:min(88vw,460px);text-align:center;
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:clamp(15px,3.8vw,19px);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--red)}
#keys{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(46px + env(safe-area-inset-bottom,0px));color:#fff;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none;white-space:nowrap}
#joy{position:fixed;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 3px rgba(255,255,255,.6);pointer-events:none;transition:opacity .15s}
#joy.rest{opacity:.7}
#nub{position:absolute;left:32px;top:32px;width:48px;height:48px;border-radius:12px;background:var(--yellow);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;overflow:auto;gap:18px;
  padding-block:calc(22px + env(safe-area-inset-top,0px)) calc(22px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(19,27,48,.42)}
.screen>*{flex:none}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7.2vw,58px);line-height:1.05;margin:auto 0 0;text-align:center;color:#fff;text-shadow:0 4px 0 var(--red),0 8px 0 rgba(0,0,0,.25);text-wrap:balance}
.lead{margin:0;color:#fff;text-align:center;font-size:clamp(16px,3.8vw,20px);max-width:34em;text-shadow:0 1px 4px rgba(0,0,0,.6);text-wrap:balance}
.part{font-family:var(--display);font-weight:400;color:#fff;font-size:clamp(15px,3.6vw,20px);margin:6px 0 0;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px 12px;width:min(100%,900px);padding-top:8px}
#houses{margin-bottom:auto}
#menu{background:rgba(19,27,48,.55)}
#story{background:rgba(19,27,48,.82)}
#storyBox{--c:#fff;margin:auto 0;padding:12px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;width:min(100%,720px)}
#storyImg{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block;max-height:62vh}
#storyText{margin:0;padding:0 8px;font-size:clamp(17px,4.2vw,22px);line-height:1.3;text-align:center;text-wrap:balance}
#winImg{height:92px;max-width:150px;object-fit:contain}
.card{--c:#fff;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;transition:transform .08s}
.card:not(:disabled):active{transform:translateY(3px)}
.card:disabled{--c:#c9cfdb;cursor:default}
.card canvas,.card img{width:100%;max-width:130px;aspect-ratio:1;object-fit:contain;image-rendering:auto}
.card canvas{image-rendering:pixelated}
.card b{font-size:clamp(14px,2.2vw,16px);font-weight:900;line-height:1.15;text-align:center}
.stars{color:#d59a00;font-size:16px;letter-spacing:1px;min-height:20px}
.stars i{font-style:normal;color:rgba(0,0,0,.18)}
#win{background:none;pointer-events:none}
#winBox{--c:#fff;margin:auto 0 0;pointer-events:auto;padding:20px 22px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;width:min(100%,430px);text-align:center}
#winBox h2{font-family:var(--display);font-weight:400;font-size:clamp(20px,5vw,27px);line-height:1.2;margin:0;text-wrap:balance}
#winBox p{margin:0;font-size:17px}
#winStars{font-size:36px;color:#ffb400;letter-spacing:4px}
#winStars i{font-style:normal;color:#dfe4ec}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
@media (max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));max-width:340px}
  #cards .card:last-child{grid-column:1/-1;justify-self:center;width:calc(50% - 6px)}}
</style>

<canvas id="scene"></canvas>

<div id="hud" hidden>
  <div id="status" class="brick"><div id="lvlName"></div><div id="bar"><div id="fill"></div></div><div id="count"></div></div>
  <div id="tools">
    <button id="soundBtn" class="brick tool" aria-label="Звук">🔊</button>

<section id="menu" class="screen">
  <h1>Кирпичный лес</h1>
  <p class="lead">Злой колдун Бармалей превратил жителей волшебного леса в кирпичики. Собери всех, оживи и запри Бармалея в башне!</p>
  <button id="taleBtn" class="brick big alt">Смотреть сказку</button>

  <h2 class="part">Построй домики и башню</h2>
  <div id="houses" class="grid"></div>
</section>

  <div id="storyBox" class="brick">
    <img id="storyImg" alt="">
    <p id="storyText"></p>
    <button id="storyBtn" class="brick big">Дальше</button>
  </div>
</section>

<section id="win" class="screen" hidden>
  <div id="winBox" class="brick">
    <img id="winImg" alt="">
    <h2 id="winTitle"></h2>
    <div id="winStars"></div>
    <p id="winText"></p>
    <div class="row">
      <button id="nextBtn" class="brick big">Дальше</button>
      <button id="winMenuBtn" class="brick big alt">Меню</button>
    </div>
  </div>
</section>

'use strict';
/* ---------- Уровни. Зверята собраны из овалов [x,y,z, rx,ry,rz, цвет], голова слева; z≠0 зеркалится. ---------- */
function tower(put){ // круглая башня с дверью и зарешёченным окном наверху
  const R=6,H=26;
  for(let y=0;y<H+3;y++)for(let x=-R;x<=R;x++)for(let z=-R;z<=R;z++){
    const r=Math.hypot(x,z);
    if(r>R+.3||r<R-1.3)continue;
    if(y>=H&&(Math.round(Math.atan2(z,x)*3)%2===0))continue; // зубцы
    let c=(y+(x>0?1:0))%4===0?'B':'A';
    if(y>=H-1)c='R';
    if(z>0&&Math.abs(x)<2&&y<7)c=y===6?'Y':'D';
    if(z>0&&Math.abs(x)<3&&y>=18&&y<=23){
      if(x%2===0)put(x,y,z,'I');
      continue;
    }
    put(x,y,z,c);
  }
}
function house({w=14,d=4,h=9,tall=0}){ // домик: стены, окна, дверь, двускатная крыша
  return put=>{
    const H=h+tall,mid=(w-1)/2;
    for(let y=0;y<H;y++)for(let x=0;x<w;x++)for(let z=-d;z<=d;z++){
      if(x>0&&x<w-1&&Math.abs(z)<d)continue;
      let c=y%3===2?'B':'A';
      if(z===d&&Math.abs(x-mid)<1.6&&y<5)c='D';
      if(z===d&&(x===2||x===3||x===w-3||x===w-4)&&y>=3&&y<=5)c='G';
      if(x===0&&Math.abs(z)<2&&y>=3&&y<=5)c='G';
      if(x===w-1&&Math.abs(z)<2&&y>=3&&y<=5)c='G';
      put(x,y,z,c);
    }
    for(let k=0;k<=d+1;k++){
      const y=H+k,e=d+1-k;
      for(let x=-1;x<=w;x++){put(x,y,e,'R');put(x,y,-e,'R')}
      for(let z=-e+1;z<e;z++){put(0,y,z,'A');put(w-1,y,z,'A')}
    }
    for(let y=H;y<H+d+3;y++)for(let z=-1;z<=0;z++)for(let x=w-4;x<=w-3;x++)if(y>H+d-1-Math.abs(z)-1||z===-1)put(x,y,z-1,'C');
  };
}

        if(r<3.2||r>f.r||a<-.3||a>2.1||cells.has(x+','+y+',0'))continue;

        else c=sector%2?'m':'G';

  }
  else b.blobs.forEach(([cx,cy,cz,rx,ry,rz,c])=>{
    (cz?[cz,-cz]:[0]).forEach(z0=>{
      for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++)for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let z=Math.floor(z0-rz);z<=Math.ceil(z0+rz);z++){

function toBricks(b){

function buildWorld(i){
  clearWorld();
  const b=LEVELS[i],t=THEMES[b.theme],rand=rng(4242+i*17);
  S.lvl=i;S.bird=b;S.hits=0;S.shoos=0;
  scene.background=new THREE.Color(t.sky);scene.fog=new THREE.Fog(t.sky,48,92);
  hemi.intensity=t.hemi;sun.intensity=t.sun;
  $('hud').style.color='';

  // Плита-остров из пластин с шипами
  const T=1.5,tiles=[];
  for(let x=-R_WORLD-1;x<=R_WORLD+1;x+=T)for(let z=-R_WORLD-1;z<=R_WORLD+1;z+=T)if(Math.hypot(x,z)<R_WORLD+1.8)tiles.push([x,z]);
  const tileM=new THREE.InstancedMesh(unitBox,new THREE.MeshLambertMaterial(),tiles.length);
  const studG=new THREE.CylinderGeometry(.34,.34,.14,8);
  const studM=new THREE.InstancedMesh(studG,new THREE.MeshLambertMaterial(),tiles.length);
  const m=new THREE.Matrix4(),c=new THREE.Color();
  tiles.forEach(([x,z],n)=>{
    const wave=Math.sin(x*.21+1)*Math.cos(z*.17)+Math.sin((x+z)*.09);
    const inWater=t.water&&(Math.hypot(x+15,z+12)<8.5||Math.hypot(x-17,z+8)<6||Math.hypot(x+14,z-15)<5.5);
    c.set(inWater?t.water:(wave>.15?t.a:t.b));
    if(rand()<.1)c.offsetHSL(0,0,-.018);
    m.makeScale(T-.03,1.6,T-.03);m.setPosition(x,-.8,z);tileM.setMatrixAt(n,m);tileM.setColorAt(n,c);
    m.makeTranslation(x,.07,z);studM.setMatrixAt(n,m);studM.setColorAt(n,c);
  });
  tileM.receiveShadow=true;studM.receiveShadow=true;world.add(tileM,studM);

  // Камни под островом, чтобы он висел в небе
  const under=[];for(let n=0;n<70;n++){const a=rand()*6.28,r=Math.sqrt(rand())*R_WORLD*.86,s=2+rand()*4;under.push(box(s,3+rand()*5,s,Math.cos(a)*r,-3-rand()*3-(R_WORLD-r)*.2,Math.sin(a)*r,0x75604e))}
  const ug=new THREE.Mesh(bake(under),MAT_MATTE);ug.userData.temp=true;world.add(ug);

  // Подставка
  const pl=[box(R_PLINTH*2-.8,.5,R_PLINTH*2-.8,0,.25,0,t.plinth),box(R_PLINTH*2-2,.3,R_PLINTH*2-2,0,.65,0,0xffffff)];
  const pm=new THREE.Mesh(bake(pl),MAT);pm.receiveShadow=true;pm.castShadow=true;pm.userData.temp=true;world.add(pm);
  S.baseY=.8;
  obstacles.push({x:0,z:0,r:R_PLINTH});

  // Деревья и всё остальное
  const it=[];
  for(let n=0,tries=0;n<(b.theme==='garden'?24:15)&&tries<400;tries++){
    const a=rand()*6.28,r=15+rand()*11,x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(Math.abs(x)<4&&z>6&&z<16)continue;
    if(obstacles.some(o=>Math.hypot(o.x-x,o.z-z)<o.r+2.6))continue;
    const kind=t.decor[rand()*t.decor.length|0],cr=DECOR[kind](x,z,it,t,rand);
    if(cr)obstacles.push({x,z,r:cr});
    n++;
  }
  const dm=new THREE.Mesh(bake(it),MAT_MATTE);dm.castShadow=true;dm.receiveShadow=true;dm.userData.temp=true;world.add(dm);
  if(t.stars){
    const pts=[];for(let n=0;n<420;n++){const a=rand()*6.28,e=rand()*1.4+.05,r=120;pts.push(Math.cos(a)*Math.cos(e)*r,Math.sin(e)*r,Math.sin(a)*Math.cos(e)*r)}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
    world.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:1.1,fog:false})));
  }
  // Облака
  const cl=[];for(let n=0;n<16;n++){const a=rand()*6.28,r=36+rand()*40,x=Math.cos(a)*r,z=Math.sin(a)*r,y=10+rand()*22,s=3+rand()*5;
    cl.push(box(s*2,1.2,s,x,y,z,0xffffff),box(s,1,s*.7,x+.8,y+1,z,0xffffff))}
  const cm=new THREE.Mesh(bake(cl),new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:t.stars?.1:.85}));cm.userData.temp=true;world.add(cm);

  // Призрак птицы: подсказка, что где стоит
  const u=b.unit,g=[];
  b.bricks.forEach(br=>{const p=localPos(b,br);g.push(box(br.lx*u*.93,u*.78,br.lz*u*.93,p.x,p.y,p.z,b.pal[br.c]))});
  ghost=new THREE.Mesh(bake(g),new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:.5,depthWrite:false}));
  ghost.position.y=S.baseY;ghost.userData.temp=true;world.add(ghost);

  // Кирпичи на траве
  if(!b.chunks)b.chunks=buildChunks(b);
  b.chunks.forEach(ch=>{
    const mesh=new THREE.Mesh(ch.geo,b.glow?MAT_GLOW:MAT);mesh.castShadow=true;
    const s=freeSpot(rand),o={ch,mesh,state:'ground',x:s.x,z:s.z,phase:rand()*6,slot:ch.center.clone().add(new THREE.Vector3(0,S.baseY,0)),t:0,gy:ch.h/2+.3};
    mesh.position.set(s.x,o.gy,s.z);mesh.rotation.y=rand()*3;world.add(mesh);S.bricks.push(o);
  });

  // Последние спасённые гуляют по острову (всех сразу телефон не потянет)
  ANIMALS.filter((a,n)=>save.stars[n]&&n!==i&&n!==b.home).slice(-5).forEach(a=>addFriend(a,rand));

  for(let n=0;n<b.cats;n++){
    const boss=b.boss&&n===0,mesh=boss?makeSprite('barmaley-full',6.2):makeCat();
    if(boss){mesh.visible=false;scene.add(mesh)}
    S.cats.push({mesh,boss,state:'wait',timer:14+n*9,t:0,dir:0});
  }
  player.position.set(0,0,9.5);player.rotation.y=0;player.visible=true;
  S.yaw=0;S.camD=Math.min(28,Math.max(19,b.rows*b.unit*2+9));S.camH=S.camD*.72;
  camFocus.set(0,0,9.5);
}
function addFriend(a,rand=Math.random){
  const f=makeSprite(a.art,a.tall*.56),s=freeSpot(rand);
  f.position.set(s.x,0,s.z);f.u={tx:s.x,tz:s.z,rest:rand()*3,ph:rand()*6,fly:a.bird};world.add(f);friends.push(f);return f;
}
function freeSpot(rand){
  for(let i=0;i<60;i++){
    const a=rand()*6.28,r=R_PLINTH+2.2+rand()*(R_WORLD-R_PLINTH-3.5),x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(!obstacles.some(o=>Math.hypot(o.x-x,o.z-z)<o.r+.9))return{x,z};

}

function tone(f,d,type='square',vol=.06,to=0,when=0){
  if(!ac||!soundOn)return;const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);
}

const PMAX=260,particles=[];
const pMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(.22,.14,.22),new THREE.MeshLambertMaterial(),PMAX);pMesh.frustumCulled=false;scene.add(pMesh);
pMesh.setColorAt(0,new THREE.Color(0xffffff));
function burst(x,y,z,colors,n,sp=6){
  for(let i=0;i<n&&particles.length<PMAX;i++){
    const a=Math.random()*6.28,e=Math.random()*sp;
    particles.push({x,y,z,vx:Math.cos(a)*e,vy:2+Math.random()*sp,vz:Math.sin(a)*e,life:.8+Math.random()*.9,c:colors[Math.random()*colors.length|0],r:Math.random()*6});
  }
}
const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_e=new THREE.Euler(),_p=new THREE.Vector3(),_s=new THREE.Vector3(1,1,1),_c=new THREE.Color();
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}
    p.vy-=13*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.r+=dt*7;if(p.y<.1){p.y=.1;p.vy*=-.4;p.vx*=.7;p.vz*=.7}}
  pMesh.count=particles.length;
  particles.forEach((p,i)=>{_e.set(p.r,p.r*.7,0);_q.setFromEuler(_e);_p.set(p.x,p.y,p.z);_m.compose(_p,_q,_s);pMesh.setMatrixAt(i,_m);pMesh.setColorAt(i,_c.set(p.c))});
  pMesh.instanceMatrix.needsUpdate=true;if(pMesh.instanceColor)pMesh.instanceColor.needsUpdate=true;
}

    joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.x=joy.y=0;
    const j=$('joy');j.style.left=e.clientX+'px';j.style.top=e.clientY+'px';j.classList.remove('rest');

    if(l>mx){dx*=mx/l;dy*=mx/l}

  }else if(drag&&e.pointerId===drag.id){S.yaw-=(e.clientX-drag.x)*.006;drag.x=e.clientX}

}
function updateCat(c,dt){
  c.t+=dt;const m=c.mesh,p=m.position;
  const go=(tx,tz,sp)=>{const dx=tx-p.x,dz=tz-p.z,l=Math.hypot(dx,dz)||1;p.x+=dx/l*sp*dt;p.z+=dz/l*sp*dt;
    if(c.boss){turn(m,dx*Math.cos(S.yaw)-dz*Math.sin(S.yaw)<0);return l}
    m.rotation.y=Math.atan2(dz,-dx);const sw=Math.sin(S.time*15)*.7;m.legs.forEach((g,i)=>g.rotation.z=i%3?sw:-sw);return l};
  if(c.boss){tick(m,dt);faceCamera(m)}else m.tail.rotation.z=Math.sin(S.time*7)*.35;
  if(c.state==='wait'){
    c.timer-=dt;
    if(c.timer<=0){
      if(S.bricks.filter(b=>b.state==='placed').length<2){c.timer=3;return}
      const a=Math.random()*6.28;p.set(Math.cos(a)*(R_WORLD-1),0,Math.sin(a)*(R_WORLD-1));m.visible=true;if(!c.boss)m.rotation.y=Math.atan2(-p.z,p.x);
      c.state='peek';c.t=0;c.den=a;c.boss?sfx.grumble():sfx.meow();toast(c.boss?'Бармалей идёт! Не дай ему сломать башню!':'Кот Бандит идёт! Беги и прогони его!',true);
    }
  }else if(c.state==='peek'){
    p.y=Math.abs(Math.sin(c.t*9))*.35;if(c.t>1.4){p.y=0;c.state='run'}
  }else if(c.state==='run'){
    if(go(0,0,4.4)<R_PLINTH+.6){c.state='swipe';c.t=0}
  }else if(c.state==='swipe'){
    p.y=Math.sin(Math.min(c.t/.5,1)*Math.PI)*1.6;
    if(c.t>.5){p.y=0;scatter(c);c.state='flee'}
  }else if(c.state==='flee'){
    const tx=Math.cos(c.den)*(R_WORLD+6),tz=Math.sin(c.den)*(R_WORLD+6);
    if(go(tx,tz,10)<1){m.visible=false;c.state='wait';c.timer=S.bird.catEvery*(.85+Math.random()*.3)}
  }
  if((c.state==='run'||c.state==='peek')&&Math.hypot(p.x-player.position.x,p.z-player.position.z)<2.1){
    p.y=0;c.state='flee';c.den=Math.atan2(p.z,p.x);S.shoos++;sfx.shoo();toast(c.boss?'Бармалей убежал! Строй скорее!':'Кыш! Кот Бандит убежал!');
    burst(p.x,1.2,p.z,[0xf08a24,0xffffff,0xffc928],14,5);
  }
}
function updatePlayer(dt){
  let ix=joy.x,iz=joy.y;
  if(keys.has('l'))ix-=1;if(keys.has('r'))ix+=1;if(keys.has('u'))iz-=1;if(keys.has('d'))iz+=1;
  if(keys.has('q'))S.yaw+=dt*1.8;if(keys.has('e'))S.yaw-=dt*1.8;
  S.ix=ix;S.iz=iz;
  const l=Math.hypot(ix,iz),p=player.position;
  if(l>.05){
    const k=Math.min(l*1.5,1)/l,sp=8.6;ix*=k;iz*=k;
    const c=Math.cos(S.yaw),s=Math.sin(S.yaw),dx=ix*c+iz*s,dz=-ix*s+iz*c;
    p.x+=dx*sp*dt;p.z+=dz*sp*dt;
    let want=Math.atan2(-dx,-dz),d=want-player.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));player.rotation.y+=d*Math.min(1,dt*13);
    const w=Math.sin(S.time*13)*.85;player.legL.rotation.x=w;player.legR.rotation.x=-w;player.armL.rotation.x=-w;player.armR.rotation.x=w;
  }else{['legL','legR','armL','armR'].forEach(k=>player[k].rotation.x*=.75)}
  obstacles.forEach(o=>{const dx=p.x-o.x,dz=p.z-o.z,d=Math.hypot(dx,dz);if(d<o.r+.5&&d>0){p.x=o.x+dx/d*(o.r+.5);p.z=o.z+dz/d*(o.r+.5)}});
  const r=Math.hypot(p.x,p.z);if(r>R_WORLD){p.x*=R_WORLD/r;p.z*=R_WORLD/r}
}
function updateBricks(dt){

  S.bricks.forEach(o=>{
    const m=o.mesh;
    if(o.state==='ground'){
      m.position.set(o.x,o.gy+Math.sin(S.time*2.4+o.phase)*.12,o.z);m.rotation.y+=dt*1.1;

    }else if(o.state==='fly'){

      m.position.lerpVectors(o.from,o.to,e);m.position.y+=Math.sin(k*Math.PI)*o.arc;

      o.pop=Math.max(0,o.pop-dt*5);m.scale.setScalar(1+Math.sin(o.pop*3.14)*.14);if(!o.pop)m.scale.setScalar(1);
    }

function updateArrow(){

const camFocus=new THREE.Vector3();
function updateCamera(dt){
  if(S.mode==='menu'){
    const a=S.time*.11,b=S.bird,d=38;

  }
  if(S.mode==='win'||S.mode.startsWith('wake')){
    const near=Math.min(S.winT/1.2,1),a=S.yaw*(1-near)+Math.sin(S.winT*.4)*.2,d=S.camD*lerp(1,camera.aspect<1?1.02:.72,near);
    const h=S.mode!=='win'?S.baseY+1.5:S.bird.boss?7.5:Math.min(S.bird.rows*S.bird.unit*.42+S.baseY,7);
    camFocus.lerp(_p.set(0,h,S.mode==='win'&&winBird&&S.bird.build?3:0),Math.min(1,dt*2.2));
    camera.position.set(camFocus.x+Math.sin(a)*d,camFocus.y+S.camH*lerp(.55,.26,near),camFocus.z+Math.cos(a)*d);camera.lookAt(camFocus);return;
  }

  camera.position.set(camFocus.x+Math.sin(S.yaw)*S.camD,S.camH,camFocus.z+Math.cos(S.yaw)*S.camD);

}
function updateFriends(dt){
  const cx=Math.cos(S.yaw),sx=-Math.sin(S.yaw);
  friends.forEach(f=>{
    const u=f.u,dx=u.tx-f.position.x,dz=u.tz-f.position.z,d=Math.hypot(dx,dz);
    f.visible=S.mode==='play'||S.mode==='menu'||f.position.distanceTo(camera.position)>15; // не загораживают главный момент
    tick(f,dt);
    if(u.fixed){faceCamera(f);return}
    if(d<.3){
      u.rest-=dt;
      if(u.rest<=0){const s=freeSpot(Math.random);u.tx=s.x;u.tz=s.z;u.rest=1+Math.random()*4}
    }else{
      f.position.x+=dx/d*2.6*dt;f.position.z+=dz/d*2.6*dt;
      turn(f,dx*cx+dz*sx<0);
    }
    if(u.fly)f.plane.position.y=2.6+Math.sin(S.time*2+u.ph)*.5; // птицы порхают над землёй
    faceCamera(f);
  });
}

const glowSprite=(()=>{

function updateWin(dt){

  $('hud').hidden=$('hands').hidden=$('keys').hidden=true;$('win').hidden=true;$('story').hidden=true;$('menu').hidden=false;renderCards();
}
function startLevel(i){
  S.mode='play';buildWorld(i);player.visible=true;setHero(save.hero);heroSprite.scale.setScalar(1);player.position.y=0;
  $('menu').hidden=$('win').hidden=true;$('hud').hidden=$('hands').hidden=false;$('keys').hidden=touchDevice;
  joyRest();drawHud();drawHands();
  const b=S.bird;
  toast(i===0?(touchDevice?'Води пальцем по экрану, чтобы бежать. Неси детальки на подставку!':'Подбирай детальки и неси на подставку. За раз можно взять 4.'):
    b.boss?'Построй башню! Бармалей попробует её сломать: гони его прочь!':b.build?`Построй: ${b.name}! Кот Бандит всё ещё хулиганит.`:`Спаси: ${b.name}! Жёлтая стрелка покажет, куда бежать.`,false,4);
  setTimeout(()=>{if(S.mode==='play')$('keys').hidden=true},9000);
}
$('menuBtn').onclick=showMenu;
$('winMenuBtn').onclick=showMenu;
$('taleBtn').onclick=()=>{audio();tale('intro',showMenu)};
$('nextBtn').onclick=()=>{
  if(S.mode==='wakeDone')startLevel(R_N);
  else if(S.lvl===R_N-1&&!save.hero)startWake();
  else if(S.lvl===TOWER)tale('end',showMenu);
  else startLevel(S.lvl+1);
};
function drawSound(){$('soundBtn').textContent=soundOn?'🔊':'🔇'}
$('soundBtn').onclick=()=>{audio();soundOn=!soundOn;drawSound();try{localStorage.setItem('kirpich-sound',soundOn?'on':'off')}catch(e){}};
drawSound();

/* ---------- Цикл ---------- */
function resize(){const w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?62:46;camera.updateProjectionMatrix();if(joy.id===null)joyRest()}
addEventListener('resize',resize);resize();
let last=performance.now(),fpsT=0,frames=0,quality=2;
function watchSpeed(raw){ // слабый телефон: сначала меньше пикселей, потом без теней
  if(raw>.5){fpsT=frames=0;return}
  fpsT+=raw;frames++;
  if(fpsT<3)return;
  const fps=frames/fpsT;fpsT=frames=0;
  if(fps>=28||!quality)return;
  quality--;
  if(quality===1){renderer.setPixelRatio(1);resize()}else sun.castShadow=false;
}
function frame(now){
  requestAnimationFrame(frame);
  const raw=(now-last)/1000;last=now;watchSpeed(raw);step(Math.min(raw,.05));
}
function step(dt){
  S.time+=dt;S.dt=dt;
  if(S.mode==='play'){updatePlayer(dt);S.cats.forEach(c=>updateCat(c,dt))}
  if(S.mode==='win')updateWin(dt);
  if(S.mode==='wake'||S.mode==='wakeDone')updateWake(dt);
  updateBricks(dt);updateArrow();updateCamera(dt);updateFriends(dt);updateHero();updateParticles(dt);
  renderer.render(scene,camera);
}
window.__kp={S,LEVELS,R_N,TOWER,startLevel,keys,player,save,step,joy,startWin,startWake,showMenu,friends:()=>friends};
showMenu();
requestAnimationFrame(frame);
</script>
